name: Publish to VS Code Marketplace

# Publishes whenever a version tag is pushed, e.g. v0.2.0.
# Release flow:
#   1. bump "version" in package.json
#   2. commit
#   3. git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      # Safety net: build explicitly so a regression in the prepublish hook can't
      # ship a broken VSIX. (vsce re-runs prepublish below, but failing fast here
      # keeps a bad build from ever being published.)
      - name: Build (esbuild bundle)
        run: npm run build

      # vsce runs the "vscode:prepublish" script (esbuild bundle)
      # automatically before packaging. --no-dependencies because esbuild already
      # bundles every runtime dep into dist/. --skip-duplicate makes a re-run of an
      # existing version a no-op instead of a hard failure.
      - name: Publish to Marketplace
        run: npx @vscode/vsce publish --no-dependencies --skip-duplicate --pat ${{ secrets.VSCE_PAT }}
