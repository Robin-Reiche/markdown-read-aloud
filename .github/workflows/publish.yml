name: Publish to VS Code Marketplace and Open VSX

# Publishes whenever a version tag is pushed, e.g. v0.2.0.
# Release flow:
#   1. bump "version" in package.json
#   2. commit
#   3. git tag v0.2.0 && git push origin v0.2.0
# workflow_dispatch is here so a release can be re-published to a registry that
# was added or fixed after its tag was already pushed.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to publish, e.g. v1.14.0"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      # Safety net: build explicitly so a regression in the prepublish hook can't
      # ship a broken VSIX. (vsce re-runs prepublish below, but failing fast here
      # keeps a bad build from ever being published.)
      - name: Build (esbuild bundle)
        run: npm run build

      # Packaged once and sent to both registries, so the VSIX on Open VSX is byte
      # for byte the one on the Marketplace rather than a second build.
      # --no-dependencies because esbuild already bundles every runtime dep into dist/.
      - name: Package
        run: npx @vscode/vsce package --no-dependencies --out markdown-read-aloud.vsix

      # --skip-duplicate on both, so re-running the job after one registry failed
      # does not stop at the one that already went through.
      - name: Publish to Marketplace
        run: npx @vscode/vsce publish --packagePath markdown-read-aloud.vsix --skip-duplicate --pat ${{ secrets.VSCE_PAT }}

      # Open VSX is the registry behind Cursor, VSCodium, Windsurf, Gitpod and
      # Theia. Namespace RobinReiche, same one csv-grid-editor publishes to.
      - name: Publish to Open VSX
        run: npx ovsx publish markdown-read-aloud.vsix --skip-duplicate --pat ${{ secrets.OVSX_PAT }}
